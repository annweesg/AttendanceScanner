<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Scanner</title>

    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

    <!-- MAIN PAGE -->
    <div id="mainPage">

        <button id="enterButton">
            ENTER
        </button>

    </div>


    <!-- SCANNER PAGE -->
    <div id="scannerPage" style="display: none;">

        <h1>Attendance Scanner</h1>

        <!-- CAMERA -->
        <div id="reader"></div>

        <!-- STATUS -->
        <div class="displayBox">
            <div class="boxTitle">STATUS</div>
            <div id="statusDisplay">Ready to Scan</div>
        </div>

        <!-- GEID -->
        <div class="displayBox">
            <div class="boxTitle">GEID</div>
            <div id="geidDisplay">--</div>
        </div>

        <!-- SCAN BUTTON -->
        <button id="scanButton">
            SCAN BARCODE
        </button>

        <!-- BACK BUTTON -->
        <button id="backButton" aria-label="Back">
            ←
        </button>

    </div>


    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js?v=5"></script>

</body>

</html>
